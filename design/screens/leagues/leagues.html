<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DharmaPath — Leagues Leaderboard</title>
    <!-- Outfit Font & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0C0E12;
            --bg-dark-2: #14171D;
            --card-dark: #151A22;
            --card-dark-border: rgba(255, 255, 255, 0.08);
            --text-light: #F3EFE6;
            --text-muted: #7C8492;
            --accent: #E8500A; /* Vibrant Orange */
            --promotion-glow: rgba(52, 168, 83, 0.15); /* Faint Green */
            --demotion-glow: rgba(234, 67, 53, 0.1); /* Faint Red */
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background: #242933;
            font-family: var(--font-body);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Phone mockup styling */
        .phone {
            position: relative;
            width: 412px;
            height: 866px;
            background: #1C2028;
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8),
                        inset 0 0 0 2px rgba(255,255,255,0.1),
                        inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000000;
            border-radius: 20px;
            z-index: 1000;
        }

        .island {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000000;
            border-radius: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            box-sizing: border-box;
        }

        .island-cam {
            width: 8px;
            height: 8px;
            background: #111122;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .island-mic {
            width: 4px;
            height: 4px;
            background: #0a0a14;
            border-radius: 50%;
        }

        .phone-inner {
            position: relative;
            width: 390px;
            height: 844px;
            background: var(--bg-dark);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        .blueprint {
            position: absolute;
            top: 0;
            left: 0;
            width: 390px;
            height: 844px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 28px 4px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-body);
            color: rgba(255, 255, 255, 0.7);
            z-index: 100;
            background: var(--bg-dark);
        }

        .status-time {
            letter-spacing: -0.2px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-dark);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
        }

        .app-title {
            font-family: 'Space Grotesk', var(--font-body);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-light);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-badges {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(21, 26, 34, 0.85);
            border: 1px solid var(--card-dark-border);
            border-radius: 99px;
            padding: 4px 10px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }

        .badge.streak {
            border-color: rgba(232, 80, 10, 0.35);
            box-shadow: 0 0 10px rgba(232, 80, 10, 0.05);
        }

        .badge.hearts {
            border-color: rgba(226, 71, 47, 0.35);
            box-shadow: 0 0 10px rgba(226, 71, 47, 0.05);
        }

        /* Scrollable Content */
        .content-scroll {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 15px 20px 100px;
            box-sizing: border-box;
            gap: 12px;
        }

        .content-scroll::-webkit-scrollbar {
            display: none;
        }
        .content-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* League Banner styling */
        .league-banner {
            width: 100%;
            height: 110px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: linear-gradient(135deg, #2A1A12 0%, #151A22 100%);
            border: 1px solid rgba(232, 80, 10, 0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            clip-path: polygon(0 20px, 20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            margin-bottom: 4px;
        }

        .banner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tech-label {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .banner-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-light);
            margin: 4px 0 0;
        }

        .banner-time {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Leaderboard table list */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .board-row {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--card-dark);
            border: 1px solid var(--card-dark-border);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        /* Current user row highlight */
        .board-row.user-row {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(232, 80, 10, 0.1);
        }

        /* Promotion/Demotion row cues */
        .board-row.promo-row {
            background: linear-gradient(90deg, var(--promotion-glow) 0%, var(--card-dark) 40%);
            border-left: 3px solid #34A853;
        }

        .board-row.demote-row {
            background: linear-gradient(90deg, var(--demotion-glow) 0%, var(--card-dark) 40%);
            border-left: 3px solid #EA4335;
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-num {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            width: 16px;
            text-align: center;
        }

        .board-row.user-row .rank-num {
            color: var(--accent);
        }

        .avatar-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-dark-2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .board-row.user-row .avatar-circle {
            border-color: var(--accent);
        }

        .username {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-xp {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
        }

        .xp-label {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Footer Nav */
        .footer-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 390px;
            height: 75px;
            z-index: 100;
        }

        .nav-bg-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            pointer-events: none;
        }

        .nav-active-bubble {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 105;
            transform: translateX(273px); /* Default active offset for Leagues tab */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(232, 80, 10, 0.4);
            pointer-events: none;
        }

        .nav-items-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 110;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 60px;
            height: 100%;
            color: var(--text-muted);
            transition: color 0.2s;
            position: relative;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-bottom: 2px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), fill 0.2s;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 500;
            font-family: var(--font-body);
        }

        .nav-item.active {
            color: var(--text-light);
        }

        .nav-item.active svg {
            fill: #FFFFFF;
            transform: translateY(-16px);
        }
    </style>
</head>

    <script>
        function setActiveTab(index) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            const bubble = document.querySelector('.nav-active-bubble');
            const offset = 78 * index;
            bubble.style.transform = `translateX(${offset + 39}px)`;

            const centerX = 39 + offset;
            const path = document.querySelector('.nav-bg-svg path');
            const pathD = `M 0 20 L ${centerX - 25} 20 C ${centerX - 17} 20, ${centerX - 15} 52, ${centerX} 52 C ${centerX + 15} 52, ${centerX + 17} 20, ${centerX + 25} 20 L 390 20 L 390 75 L 0 75 Z`;
            path.setAttribute('d', pathD);
        }

        window.onload = function() {
            setActiveTab(3); // Leagues tab active on load
        }
    </script>
